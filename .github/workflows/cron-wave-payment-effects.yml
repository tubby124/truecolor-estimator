name: Wave payment effect delivery

on:
  schedule:
    # Backup only. GitHub does not reliably deliver a 5-minute schedule, so this
    # claimed */5 while actually firing far less often — the outage it was meant
    # to cover could last hours without anyone noticing. The primary delivery is
    # now the Railway `google-ads-monitor-cron` service at */5; this stays as a
    # truthful 15-minute backup cadence.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deliver Wave payment effect outbox
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --retry 2 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://truecolorprinting.ca/api/cron/wave-payment-effects
